[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtructure"
version = "0.1.4"
description = "JAX-optimized data structures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "tinker495", email = "wjdrbtjr495@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "absl-py",
    "chex>=0.1.0",
    "jax>=0.11.2",
    "jax[cuda]>=0.11.2; sys_platform == 'linux'",
    "jaxtyping>=0.2.36",
    "matplotlib",
    "numpy>=2.2.0",
    "rich",
    "typing-extensions",
    "tyro>=1.0.16,<2",
]

[project.urls]
Homepage = "https://github.com/tinker495/Xtructure"

[project.optional-dependencies]
docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
tpu = ["jax[tpu]>=0.11.2"]

[dependency-groups]
dev = [
    "xtructure[docs]",
    "pre-commit",
    "pyrefly==1.4.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xtructure*", "xtructure_benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "pallas_heap: hardware-specific BGPQ/Pallas heap stress tests; opt in with XTRUCTURE_RUN_PALLAS_HEAP_TESTS=1",
]
